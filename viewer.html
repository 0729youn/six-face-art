<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>6면체 작품 감상</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#101114;color:#fff;font-family:system-ui,sans-serif}
#viewer{position:fixed;inset:0}#sequence{position:fixed;z-index:5;right:18px;top:18px;display:flex;gap:5px;flex-wrap:wrap;max-width:350px;justify-content:flex-end}
.seq{padding:6px 8px;border:1px solid #555;background:#0b0c0fbb;border-radius:8px;font-size:10px;color:#aeb4bf}.seq.active{color:#fff;border-color:#fff;background:#ffffff22;font-weight:800}
#current{position:fixed;z-index:5;right:18px;top:70px;padding:7px 10px;background:#0b0c0fbb;border-radius:9px;font-size:11px}
#status{position:fixed;z-index:5;bottom:17px;left:50%;transform:translateX(-50%);background:#0009;padding:8px 13px;border-radius:999px;font-size:11px;white-space:nowrap}
#error{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:#ddd;padding:30px}
</style></head><body>
<div id="viewer"></div><div id="error"></div>
<div id="sequence"><span class="seq">① 윗면</span><span class="seq">② 앞면</span><span class="seq">③ 오른쪽</span><span class="seq">④ 뒷면</span><span class="seq">⑤ 왼쪽</span><span class="seq">⑥ 아랫면</span></div>
<div id="current">불러오는 중…</div><div id="status">드래그: 회전 · 휠/핀치: 확대·축소</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";import{OrbitControls}from"three/addons/controls/OrbitControls.js";
const names=["윗면","앞면","오른쪽 면","뒷면","왼쪽 면","아랫면"],layers=["bg","character","frame"];
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101114);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,100);camera.position.set(0,0,10);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;viewer.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=6;controls.maxDistance=20;
const group=new THREE.Group();scene.add(group);const loader=new THREE.TextureLoader();

function add(url,w,h,n,r,b,depth,fill,i){
 const t=loader.load(url);t.colorSpace=THREE.SRGBColorSpace;
 const m=new THREE.MeshBasicMaterial({map:t,transparent:true,side:THREE.DoubleSide,depthWrite:true,alphaTest:.01});
 let pw=w,ph=h;if(!fill&&t.image){let ir=t.image.width/t.image.height,fr=w/h;if(ir>fr){pw=w;ph=w/ir}else{ph=h;pw=h*ir}}
 const mesh=new THREE.Mesh(new THREE.PlaneGeometry(pw,ph),m);
 mesh.position.copy(b).add(n.clone().multiplyScalar(depth+.025));mesh.rotation.copy(r);
 let fg=group.getObjectByName("face"+i);if(!fg){fg=new THREE.Group();fg.name="face"+i;fg.userData.normal=n.clone();fg.userData.faceIndex=i;group.add(fg)}fg.add(mesh);
}
function renderWork(p){
 group.clear();const w=p.dim.w,h=p.dim.h,d=p.dim.d,x=w/2,y=h/2,z=d/2;
 const q=[
 {n:new THREE.Vector3(0,1,0),r:new THREE.Euler(-Math.PI/2,0,0),s:[w,d],b:new THREE.Vector3(0,y,0)},
 {n:new THREE.Vector3(0,0,1),r:new THREE.Euler(0,0,0),s:[w,h],b:new THREE.Vector3(0,0,z)},
 {n:new THREE.Vector3(1,0,0),r:new THREE.Euler(0,Math.PI/2,0),s:[d,h],b:new THREE.Vector3(x,0,0)},
 {n:new THREE.Vector3(0,0,-1),r:new THREE.Euler(0,Math.PI,0),s:[w,h],b:new THREE.Vector3(0,0,-z)},
 {n:new THREE.Vector3(-1,0,0),r:new THREE.Euler(0,-Math.PI/2,0),s:[d,h],b:new THREE.Vector3(-x,0,0)},
 {n:new THREE.Vector3(0,-1,0),r:new THREE.Euler(Math.PI/2,0,Math.PI),s:[w,d],b:new THREE.Vector3(0,-y,0)}
 ];
 for(let i=0;i<6;i++)for(const k of layers){let u=p.files?.[i]?.[k];if(u)add(u,q[i].s[0],q[i].s[1],q[i].n,q[i].r,q[i].b,p.depth[i][k],k==="bg",i)}
 current.textContent="현재: 앞면";
}
let previewReady=new URLSearchParams(location.search).get("preview")==="1";
async function load(){
 try{
  if(previewReady){current.textContent="관람객 시점 미리보기";return}
  const qs=new URLSearchParams(location.search);
  const id=qs.get("id");if(!id)throw Error("작품 번호가 없습니다.");
  const r=await fetch(`/api/work?id=${encodeURIComponent(id)}`);
  if(!r.ok)throw Error("작품을 찾을 수 없습니다.");
  renderWork(await r.json());
 }catch(e){error.style.display="flex";error.textContent=e.message}
}
window.addEventListener("message",async(e)=>{
 if(!e.data || e.data.type!=="sixFacePreview")return;
 try{
  const p=e.data.meta;p.files={};
  const entries=e.data.files||{};
  for(const key of Object.keys(entries)){
   const [i,k]=key.split(":");
   p.files[i]??={};
   p.files[i][k]=URL.createObjectURL(entries[key]);
  }
  renderWork(p);
 }catch(err){error.style.display="flex";error.textContent="미리보기를 불러오지 못했습니다: "+err.message}
});
function update(){const cam=group.worldToLocal(camera.getWorldPosition(new THREE.Vector3()).clone());let best=-1,bd=-9;
 group.children.forEach(o=>{let to=cam.clone().sub(o.position).normalize(),dot=o.userData.normal.dot(to);o.visible=dot>.08;if(dot>bd){bd=dot;best=o.userData.faceIndex}});
 if(best>=0){document.querySelectorAll(".seq").forEach((e,i)=>e.classList.toggle("active",i===best));current.textContent="현재: "+names[best]}}
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function loop(){requestAnimationFrame(loop);controls.update();update();renderer.render(scene,camera)}load();loop();
</script></body></html>
