<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6면체 작품 제작</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101114;color:#fff;font-family:system-ui,-apple-system,sans-serif}
main{max-width:760px;margin:24px auto;padding:22px;background:#191b20;border:1px solid #363942;border-radius:18px}
h1{margin:0 0 7px}.desc{font-size:13px;color:#adb3bd;line-height:1.65}
.face{margin:14px 0;padding:14px;border:1px solid #363941;border-radius:12px}
h3{margin:0 0 10px;font-size:14px}label{display:block;font-size:11px;color:#bfc4cc;margin:8px 0 4px}
input[type=file]{width:100%;padding:7px;background:#101114;color:#fff;border:1px solid #454952;border-radius:7px}
input[type=range]{width:100%}
button{width:100%;padding:12px;margin-top:10px;border:0;border-radius:10px;font-weight:800;cursor:pointer}
#preview{background:#fff;color:#111}#save{background:#fff;color:#111}
#progressWrap{display:none;margin-top:12px}.bar{height:13px;background:#30333b;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:#fff;transition:width .15s}.pct{text-align:center;margin-top:7px;font-size:12px}
#msg{margin-top:12px;font-size:12px;color:#c6cad2;line-height:1.6}a{color:#fff}
#previewBox{display:none;position:fixed;inset:0;z-index:20;background:#101114}
#previewFrame{width:100%;height:100%;border:0}
.close{position:absolute;right:18px;top:18px;width:auto;padding:10px 14px;background:#fff;color:#111;z-index:22}
.dim{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:600px){main{margin:0;border-radius:0}.dim{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>가로형 6면체 작품 제작</h1>
<div class="desc">
순서: <b>① 윗면 → ② 앞면 → ③ 오른쪽 → ④ 뒷면 → ⑤ 왼쪽 → ⑥ 아랫면</b><br>
고해상도 원본은 공유 링크에 넣지 않고 온라인 저장소에 직접 업로드합니다.
</div>
<div class="dim">
<label>가로<input id="W" type="number" value="6" min="2" step=".1"></label>
<label>높이<input id="H" type="number" value="3.6" min="2" step=".1"></label>
<label>깊이<input id="D" type="number" value="2.6" min="1" step=".1"></label>
</div>
<div id="faces"></div>
<button id="preview">👁 관람객 시점 미리보기</button>
<button id="save">⚡ 인터넷에 저장하고 짧은 공유 링크 만들기</button>
<div id="progressWrap"><div class="bar"><div class="fill" id="fill"></div></div><div class="pct" id="pct">0%</div></div>
<div id="msg"></div>
</main>

<div id="previewBox">
<iframe id="previewFrame"></iframe>
<button class="close" onclick="closePreview()">편집으로 돌아가기</button>
</div>

<script type="module" src="/src/main.js"></script>
</body></html>
